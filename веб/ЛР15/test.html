<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Проверка API 1С</title>
</head>
<body>
    <h2>Проверка пользователей 1С</h2>

    <p>Имя:</p>
    <input id="name" placeholder="Иванов Иван">

    <p>Группа:</p>
    <input id="group" value="478">

    <p>ID пользователя (для изменения и удаления):</p>
    <input id="id" type="number" value="1">

    <br><br>
    <button onclick="addUser()">Добавить</button>
    <button onclick="getUsers()">Показать пользователей</button>
    <button onclick="editUser()">Изменить</button>
    <button onclick="deleteUser()">Удалить</button>

    <pre id="result"></pre>

    <script>
        const url = "/Lab15/hs/api/users";

        async function request(path, method, data) {
            try {
                const response = await fetch(path, {
                    method: method,
                    headers: {"Content-Type": "application/json"},
                    body: data ? JSON.stringify(data) : undefined
                });

                const text = await response.text();
                document.getElementById("result").textContent =
                    "Статус: " + response.status + "\n" + text;
            } catch (error) {
                document.getElementById("result").textContent =
                    "Ошибка: " + error;
            }
        }

        function addUser() {
            request(url, "POST", {
                name: document.getElementById("name").value,
                group: document.getElementById("group").value
            });
        }

        function getUsers() {
            request(url, "GET");
        }

        function editUser() {
            const id = document.getElementById("id").value;
            request(url + "/" + id, "PUT", {
                name: document.getElementById("name").value,
                group: document.getElementById("group").value
            });
        }

        function deleteUser() {
            const id = document.getElementById("id").value;
            request(url + "/" + id, "DELETE");
        }
    </script>
</body>
</html>
