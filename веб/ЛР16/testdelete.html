<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тест API книг</title>
</head>
<body>
    <h2>Удаление книги</h2>

    <button onclick="deleteBook()">Удалить книгу</button>

    <pre id="result"></pre>

    <script>
        async function deleteBook() {
            const response = await fetch(
                'http://localhost/Lab15/hs/lr16/api/books/1',
                {
                    method: 'DELETE'
                }
            );

            document.getElementById('result').textContent =
                await response.text();
        }
    </script>
</body>
</html>
